syntax = "proto3";

package campus.registrations.v1;

service RegistrationService {
  rpc CancelBooking(BookingId) returns (Empty);
  rpc RegisterBooking(Booking) returns (BookingInformation);
  rpc RetrieveParticipant(ParticipantId) returns (Participant);
}

message BookingId { int64 booking_id = 1; }
message Booking { int64 event_id = 1; int64 participant_id = 2; }
message BookingInformation { int64 booking_id = 1; int64 event_id = 2; int64 participant_id = 3; string participant_name = 4; }
message ParticipantId { int64 participant_id = 1; }
message Participant { int64 participant_id = 1; string name = 2; }
message Empty {}